<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WONDER SLOT HO診断</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #1a1a2e;
    color: #fff;
    text-align: center;
    margin: 0;
    padding: 0;
    background-image: url('bg.jpg'); /* 元の背景画像 */
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
  }
  .container {
    max-width: 600px;
    margin: 50px auto;
    background: rgba(15, 23, 42, 0.9);
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    border: 2px solid #3b82f6;
  }
  h1 {
    color: #3b82f6;
    margin-bottom: 20px;
  }
  .btn {
    display: block;
    width: 80%;
    margin: 15px auto;
    padding: 15px;
    font-size: 18px;
    background-color: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.3s;
  }
  .btn:hover {
    background-color: #1d4ed8;
  }
  .btn-container {
    margin-top: 30px;
  }
  /* キャラクター・KV画像表示エリア */
  .image-container {
    margin-bottom: 20px;
  }
  .image-container img {
    max-width: 100%;
    height: auto;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .hidden {
    display: none;
  }
  .result-title {
    font-size: 24px;
    font-weight: bold;
    color: #f59e0b;
    margin-top: 20px;
  }
  .result-desc {
    margin-top: 15px;
    font-size: 16px;
    line-height: 1.6;
    text-align: left;
  }
</style>
</head>
<body>

<div class="container">
  <!-- タイトル -->
  <h1 id="title-text">WONDER SLOT HO診断</h1>

  <!-- 画像表示エリア（初期はKV、結果時はキャラ絵に変倍） -->
  <div class="image-container">
    <img id="display-image" src="KV_wanderslot.jpg" alt="WONDER SLOT">
  </div>

  <!-- 質問・説明文テキスト -->
  <div id="question-text" style="font-size: 18px; margin: 20px 0; min-height: 60px;">
    あなたにマッチするハンドアウト(HO)を診断します。
  </div>

  <!-- ボタンエリア -->
  <div class="btn-container">
    <button id="btn-left" class="btn" onclick="handleChoice(true)">診断をスタートする</button>
    <button id="btn-right" class="btn hidden" onclick="handleChoice(false)">NO</button>
  </div>
</div>

<script>
// キャラクターデータ（画像パス、テキストを完全保持）
const characters = {
  DADDY: { name: "HO DADDY", img: "daddy.jpg", desc: "冷静沈着な一家の大黒柱。周囲をまとめ上げ、圧倒的な包容力と決断力で家族を正しい道へと導くポジションです。", route: "grant" },
  MOMMY: { name: "HO MOMMY", img: "mommy.jpg", desc: "自由奔放でチャーミングな美魔女。お茶目な魅力の裏で巧みに情報を操り、場を翻弄するポジションです。", route: "grant" },
  BROTHER: { name: "HO BROTHER", img: "brother.jpg", desc: "正義感あふれる真っ直ぐな好青年。嘘偽りのない誠実さと、家族のために体を張る熱い行動力が魅力のポジションです。", route: "grant" },
  SISTER: { name: "HO SISTER", img: "sister.jpg", desc: "好奇心旺盛で器用な情報通ギャル。人当たりの良さを武器にターゲットの懐に潜り込み、スクープを持ち帰るポジションです。", route: "grant" },
  KID: { name: "HO KID", img: "kid.jpg", desc: "大人を領駕する知能を持つ若き知能派。感情に流されず、緻密な計算とスキルで家族の危機をスマートに救うポジションです。", route: "grant" },
  MAID: { name: "HO MAID", img: "maid.jpg", desc: "クールに仕事を完遂する凄腕の用心棒。無駄な会話を好まず、与えられたミッションを確実に物理で解決するポジションです。", route: "grant" },
  SECOND: { name: "HO SECOND", img: "second.jpg", desc: "策略とカリスマで君臨する組織のボス。周囲を従わせる威厳と、冷徹とも言える策略でチームを勝利へ導くポジションです。", route: "east" },
  HAMMER: { name: "HO HAMMER", img: "hammer.jpg", desc: "拳で語る最強の武闘派戦闘員。威圧的な態度と破壊的な戦闘力で、立ち塞がる敵を力技でねじ伏せるポジションです。", route: "east" },
  VEIN: { name: "HO VEIN", img: "vein.jpg", desc: "鋭い観察眼を持つ冷静な交渉役。裏社会の流通や取引を支配し、相手の本心を見抜いて冷徹に有利な条件を引き出すポジションです。", route: "east" },
  WIRE: { name: "HO WIRE", img: "wire.jpg", desc: "サバサバした性格の技術屋。専門的な技術を武器に、状況に応じた最適なトラップやガジェットを駆使するポジションです。", route: "east" },
  CHARM: { name: "HO CHARM", img: "charm.jpg", desc: "愛嬌と度胸を武器にする不敵な交渉屋。物怖じしないスタンスで相手の懐へ飛び込み、主導権を奪うポジションです。", route: "east" },
  HAWK: { name: "HO HAWK", img: "hawk.jpg", desc: "静寂の中で獲物を射抜く凄腕スナイパー。気配を消し、確実に一撃で仕事をこなす遠距離支援ポジションです。", route: "east" }
};

// 状態変数
let step = 0; 
let route = ""; 
let excluded = new Set(); 

// 質問データの定義
function getQuestionText(stepIndex) {
  const questions = [
    { text: "物語の中で特定の相手との恋愛・夫婦的なやり取り（RP）は避けたいですか?", type: "filter", tag: ["BROTHER", "CHARM", "DADDY", "MOMMY"] },
    { text: "全体をまとめたり指揮を執ったりする『リーダー役』は苦手ですか?", type: "filter", tag: ["DADDY", "SECOND"] },
    { text: "威圧的な態度をとったり厳しい言葉を使ったりするキャラクターは避けたいですか?", type: "filter", tag: ["HAMMER", "SECOND"] },
    { text: "あまり喋らない『クール・寡黙すぎる』キャラクターよりもたくさん会話を楽しめるキャラがいいですか?", type: "filter", tag: ["MAID", "HAWK"] },
    { text: "あなたが惹かれるのは、正義のために悪を成敗する『義賊の絆』ですか?", type: "route_select" }
  ];
  
  if (stepIndex < 5) return questions[stepIndex];

  // 義賊ルート（グラントファミリー）の詳細分岐
  if (route === "grant") {
    if (stepIndex === 5) return { text: "チームを引っ張るリーダーシップや、大人の落ち着き・包容力に魅力を感じますか?", type: "branch" };
    if (stepIndex === 6) return { text: "どちらかと言えば、自分から積極的に楽しむ自由奔放なタイプですか?", type: "branch" };
    {/* Q7-A1の断絶を解消: 頭脳・スキル派か、武闘派（MAID/BROTHER）かを問う質問 */}
    if (stepIndex === 7) return { text: "頭脳・スキル・情報収集を活かす『Brain』タイプと、前線で戦う『Fighter』タイプならどちらが好きですか?", type: "branch", labels: ["Brain", "Fighter"] };
    if (stepIndex === 8) return { text: "場を盛り上げる、明るく賑やかなキャラクターがいいですか?", type: "branch" };
    if (stepIndex === 9) return { text: "自分の感情をあまり表に出さない、クールでストイックな仕事人に惹かれますか?", type: "branch" };
  } 
  
  // ギャングルート（イーストハウンズ）の詳細分岐
  if (route === "east") {
    if (stepIndex === 5) return { text: "組織を引っ張るボスや、圧倒的な戦闘力で前線を張り、敵をねじ伏せる役割が好きですか?", type: "branch" };
    if (stepIndex === 6) return { text: "知略やカリスマで周囲を従わせるよりも、自分の『拳や行動』で語る方が魅力的ですか?", type: "branch" };
    if (stepIndex === 7) return { text: "爆弾や狙撃など、物理的な『特殊技術』を扱うポジションに惹かれますか?", type: "branch" };
    if (stepIndex === 8) return { text: "サバサバした性格で、機械や爆破物を扱うのが得意な方がいいですか?", type: "branch" };
    if (stepIndex === 9) return { text: "愛嬌を武器に相手の懐に飛び込むような、物怖じしないタイプが好きですか?", type: "branch" };
  }
}

// ボタンクリック時の進行制御
function handleChoice(isYes) {
  // スタート画面からの遷移
  if (step === 0) {
    step = 1;
    document.getElementById("btn-left").innerText = "YES";
    document.getElementById("btn-right").classList.remove("hidden");
    updateUI();
    return;
  }

  // 診断終了後の「最初に戻る」処理
  if (step === "result") {
    step = 0;
    route = "";
    excluded.clear();
    document.getElementById("title-text").innerText = "WONDER SLOT HO診断";
    document.getElementById("display-image").src = "KV_wanderslot.jpg";
    document.getElementById("question-text").innerText = "あなたにマッチするハンドアウト(HO)を診断します。";
    document.getElementById("btn-left").innerText = "診断をスタートする";
    document.getElementById("btn-right").classList.add("hidden");
    return;
  }

  const q = getQuestionText(step - 1);

  // 1〜4問目：地雷チェックの除外登録
  if (q.type === "filter" && isYes) {
    q.tag.forEach(id => excluded.add(id));
  }

  // 5問目：陣営選択
  if (q.type === "route_select") {
    route = isYes ? "grant" : "east";
    step = 6; // 次はステップ6（インデックス5の質問）へ
    updateUI();
    return;
  }

  // 6問目以降：各ルートの分岐ツリー
  if (route === "grant") {
    if (step === 6) {
      step = isYes ? 7 : 8; // YESならQ6、NOならQ7へ
    } else if (step === 7) {
      finalize(isYes ? "MOMMY" : "DADDY"); return;
    } else if (step === 8) {
      step = isYes ? 9 : 10; // YESならQ8(Brain)、NOならQ9(Fighter)へ
    } else if (step === 9) {
      finalize(isYes ? "SISTER" : "KID"); return;
    } else if (step === 10) {
      finalize(isYes ? "MAID" : "BROTHER"); return;
    }
  } else if (route === "east") {
    if (step === 6) {
      step = isYes ? 7 : 8; // YESならQ6、NOならQ7へ
    } else if (step === 7) {
      finalize(isYes ? "HAMMER" : "SECOND"); return;
    } else if (step === 8) {
      step = isYes ? 9 : 10; // YESならQ8、NOならQ9へ
    } else if (step === 9) {
      finalize(isYes ? "WIRE" : "HAWK"); return;
    } else if (step === 10) {
      finalize(isYes ? "CHARM" : "VEIN"); return;
    }
  }

  updateUI();
}

// 質問文とボタン文字の書き換え
function updateUI() {
  const q = getQuestionText(step - 1);
  document.getElementById("question-text").innerText = q.text;

  // ボタンのカスタムラベル（Brain / Fighterなど）があれば適用、なければYES/NO
  if (q.labels) {
    document.getElementById("btn-left").innerText = q.labels[0];
    document.getElementById("btn-right").innerText = q.labels[1];
  } else {
    document.getElementById("btn-left").innerText = "YES";
    document.getElementById("btn-right").innerText = "NO";
  }
}

// 地雷チェックを考慮した最終決定セーフティネット
function finalize(targetId) {
  let finalId = targetId;

  // もし導き出されたキャラが地雷（除外対象）だった場合
  if (excluded.has(targetId)) {
    // 同じ陣営（route）の中で、地雷に引っかかっていない代替キャラを自動検索
    const alternatives = Object.keys(characters).filter(id => characters[id].route === route && !excluded.has(id));
    if (alternatives.length > 0) {
      finalId = alternatives[0]; // 1番近い代替キャラをセット
    }
  }

  showResult(finalId);
}

// 結果表示（元の画像切り替えロジック・テキスト反映を完全再現）
function showResult(charId) {
  step = "result";
  const char = characters[charId];

  // タイトルをHO名に書き換え
  document.getElementById("title-text").innerText = "診断結果";
  
  // 中央の画像を該当キャラクターのイラストファイルに差し替え
  document.getElementById("display-image").src = char.img;
  
  // キャラクター名と詳細テキストを表示
  document.getElementById("question-text").innerHTML = `
    <div class="result-title">${char.name}</div>
    <div class="result-desc">${char.desc}</div>
  `;

  // ボタンを「最初に戻る」に変更
  document.getElementById("btn-left").innerText = "もう一度診断する";
  document.getElementById("btn-right").classList.add("hidden");
}
</script>
</body>
</html>
